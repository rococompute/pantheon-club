<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantheon Club</title>
<style>
  :root {
    --night: #1b1e2b;
    --ink: #2b2f3a;
    --paper: #fbf7ee;
    --muted: #8a8478;
    --gold: #c99a2e;
  }
  html, body { margin: 0; height: 100%; background: var(--night); overflow: hidden;
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif; }
  #stage { position: absolute; inset: 0; }
  svg#club { width: 100%; height: 100%; display: block; }
  .hud { position: absolute; left: 0; right: 0; display: flex; justify-content: space-between;
    align-items: center; gap: 12px; padding: 8px 12px; pointer-events: none; }
  .hud.top { top: 0; }
  .hud.bottom { bottom: 0; }
  .pill { background: rgba(27, 30, 43, .78); color: #f4efe4; border-radius: 999px; padding: 5px 12px;
    font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70vw;
    backdrop-filter: blur(4px); }
  .pill b { font-weight: 650; }
  .pill.dim { color: #c9c2b4; }
  #tip { position: absolute; display: none; pointer-events: none; background: var(--paper); color: var(--ink);
    border-radius: 10px; padding: 8px 10px; font-size: 12px; line-height: 1.4; max-width: 260px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, .35); }
  #tip .name { font-weight: 700; font-size: 13px; }
  #tip .sw { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
  #tip ul { margin: 4px 0 0; padding-left: 16px; }
  #gone { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(27, 30, 43, .82); color: #f4efe4; font-size: 15px; text-align: center; padding: 24px; }
  .board { font-size: 12.5px; color: #3a2f22; line-height: 1.35; height: 100%; box-sizing: border-box;
    padding: 9px 11px; overflow: hidden; }
  .board h3 { margin: 0 0 6px; font-size: 11px; letter-spacing: .14em; color: #7a5b2e; }
  .board .row { margin-bottom: 5px; display: flex; gap: 6px; align-items: flex-start; }
  .board .row span.t { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .board .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; margin-top: 4px; }
  .board .empty { color: #9a8b74; font-style: italic; }
  .board .id { color: #9a8b74; flex: none; font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) { .mote { display: none; } }
</style>
</head>
<body>
<div id="stage">
<svg id="club" viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid meet" aria-label="The club: the market's diplomats as penguins in a hall">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9dfcc"/><stop offset="1" stop-color="#f3ecdf"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdbfa6"/><stop offset="1" stop-color="#e2d6c0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbe8" stop-opacity=".75"/><stop offset="1" stop-color="#fffbe8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pool" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fffbe8" stop-opacity=".55"/><stop offset="1" stop-color="#fffbe8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="column" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9cdb6"/><stop offset=".45" stop-color="#f7f1e6"/><stop offset="1" stop-color="#cfc2a9"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7774a"/><stop offset="1" stop-color="#7d5532"/>
    </linearGradient>
    <clipPath id="floorclip"><rect x="0" y="262" width="1000" height="378"/></clipPath>
  </defs>
  <g id="room"></g>
  <g id="world"></g>
  <g id="fx"></g>
</svg>
<div class="hud top"><span class="pill" id="title">Pantheon</span><span class="pill dim" id="chain"></span></div>
<div class="hud bottom"><span class="pill dim" id="ticker">Waiting for the market…</span><span class="pill dim" id="count"></span></div>
<div id="tip"></div>
<div id="gone"></div>
</div>
<script>
"use strict";
const NS = "http://www.w3.org/2000/svg";
const room = document.getElementById("room");
const world = document.getElementById("world");
const fxLayer = document.getElementById("fx");
const tip = document.getElementById("tip");
const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function mk(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs || {}) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function group(html, parent) { const n = mk("g", {}, parent); n.innerHTML = html; return n; }
function shade(hex, amt) { // amt < 0 darker, > 0 lighter
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const t = amt < 0 ? 0 : 255, p = Math.abs(amt);
  r = Math.round(r + (t - r) * p); g = Math.round(g + (t - g) * p); b = Math.round(b + (t - b) * p);
  return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
const depth = y => 0.72 + (y - 262) / 378 * 0.5;
const rand = (a, b) => a + Math.random() * (b - a);

/* ---------------------------------------------------------------- the hall */

const FLOOR = { x0: 210, x1: 790, y0: 340, y1: 520 };
const ROSTRUM = { x: 486, y: 318 };
const BELL = { x: 500, y: 566 };
const BENCH = { x: 118, y: 566 };
const DESKS = [[178, 372], [822, 372], [150, 488], [850, 488], [292, 438], [708, 438], [262, 540], [738, 540]];

function drawRoom() {
  let h = "";
  // wall, ceiling coffers, frieze
  h += `<rect x="0" y="0" width="1000" height="262" fill="url(#wall)"/>`;
  h += `<rect x="0" y="0" width="1000" height="34" fill="#d8ccb4"/>`;
  for (let x = 6; x < 1000; x += 52) h += `<rect x="${x}" y="6" width="40" height="22" rx="2" fill="#c8b99d"/><rect x="${x + 6}" y="10" width="28" height="14" rx="1.5" fill="#d6c9b0"/>`;
  h += `<rect x="0" y="34" width="1000" height="30" fill="#e2d6c0"/><rect x="0" y="62" width="1000" height="4" fill="#cdbfa6"/>`;
  h += `<text x="500" y="56" text-anchor="middle" font-size="19" letter-spacing="11" fill="#a8957a" font-family="Georgia, 'Times New Roman', serif">PANTHEON</text>`;
  // the oculus: light from the top of the dome, a pool on the floor
  h += `<ellipse cx="500" cy="6" rx="34" ry="7" fill="#fffbe8"/>`;
  h += `<polygon points="470,6 530,6 640,430 360,430" fill="url(#beam)" opacity=".55"/>`;
  // columns, fluted
  for (const cx of [52, 168, 832, 948]) {
    h += `<rect x="${cx - 30}" y="66" width="60" height="10" fill="#d4c7ad"/><rect x="${cx - 24}" y="76" width="48" height="172" fill="url(#column)"/>`;
    for (let k = -16; k <= 16; k += 8) h += `<line x1="${cx + k}" y1="80" x2="${cx + k}" y2="244" stroke="#c9bb9f" stroke-width="1.2"/>`;
    h += `<rect x="${cx - 30}" y="244" width="60" height="12" rx="2" fill="#d4c7ad"/>`;
  }
  // the boards: the plan, the bids
  h += board(232, "planboard");
  h += board(528, "bidboard");
  h += `<rect x="0" y="252" width="1000" height="12" fill="#c9bba0"/>`;
  // floor, tiles in perspective
  h += `<rect x="0" y="262" width="1000" height="378" fill="url(#floor)"/>`;
  h += `<g clip-path="url(#floorclip)" stroke="#bfae91" stroke-width="1" opacity=".7">`;
  for (let i = 1, y = 262; y < 640; i++) { y = 262 + Math.pow(i, 1.55) * 9; h += `<line x1="0" y1="${y}" x2="1000" y2="${y}"/>`; }
  for (let x = -1500; x <= 2500; x += 110) h += `<line x1="500" y1="40" x2="${x}" y2="640"/>`;
  h += `</g>`;
  h += `<ellipse cx="500" cy="430" rx="150" ry="34" fill="url(#pool)"/>`;
  room.innerHTML = h;
  // motes in the light
  if (!reduced) for (let i = 0; i < 14; i++) {
    const m = mk("circle", { r: rand(0.8, 1.8), fill: "#fffdf3", class: "mote", opacity: 0 }, room);
    motes.push({ el: m, x: rand(440, 560), y: rand(30, 420), v: rand(4, 10), p: rand(0, 6) });
  }
}
function board(x, id) {
  return `<rect x="${x - 6}" y="82" width="252" height="164" rx="6" fill="#8a6440"/>` +
    `<rect x="${x}" y="88" width="240" height="152" rx="3" fill="#f6edd8"/>` +
    `<foreignObject x="${x}" y="88" width="240" height="152"><div xmlns="http://www.w3.org/1999/xhtml" class="board" id="${id}"></div></foreignObject>`;
}
const motes = [];

/* props: drawn in the world, sorted by depth with the penguins */
const props = [];
function prop(y, html) { const n = group(html, world); props.push({ y, node: n }); return n; }

function drawProps() {
  // the rostrum: the leader's place, under the oculus
  prop(ROSTRUM.y - 6, `
    <ellipse cx="500" cy="330" rx="86" ry="16" fill="rgba(0,0,0,.12)"/>
    <path d="M420 300 h160 l14 26 h-188z" fill="#e8dcc6"/><path d="M406 326 h188 v8 h-188z" fill="#cdbfa6"/>
    <path d="M440 288 h120 l10 12 h-140z" fill="#f2e9d8"/>`);
  prop(ROSTRUM.y - 1, `
    <path d="M532 282 h34 l-5 36 h-24z" fill="url(#wood)"/><rect x="527" y="276" width="44" height="8" rx="3" fill="#8b5e36"/>
    ${laurel(549, 300, 0.45, "#c99a2e")}`);
  // the bell: where a diplomat waits for you
  prop(BELL.y + 14, `
    <ellipse cx="500" cy="582" rx="30" ry="7" fill="rgba(0,0,0,.14)"/>
    <rect x="486" y="554" width="28" height="28" rx="3" fill="#e8dcc6"/><rect x="482" y="550" width="36" height="7" rx="2" fill="#d8cab0"/>
    <path d="M492 550 q8 -20 16 0z" fill="#c99a2e"/><circle cx="500" cy="532" r="2.5" fill="#c99a2e"/>
    <text x="500" y="573" text-anchor="middle" font-size="9" fill="#8a7a62">you</text>`);
  // the bench: for a usage limit
  prop(BENCH.y + 12, `
    <ellipse cx="118" cy="582" rx="80" ry="8" fill="rgba(0,0,0,.13)"/>
    <rect x="44" y="560" width="148" height="10" rx="3" fill="#8b5e36"/><rect x="52" y="570" width="8" height="12" fill="#6b4627"/><rect x="176" y="570" width="8" height="12" fill="#6b4627"/>`);
  // olive trees in their urns
  for (const [x, y] of [[40, 330], [960, 330]]) prop(y, `
    <ellipse cx="${x}" cy="${y + 2}" rx="26" ry="7" fill="rgba(0,0,0,.14)"/>
    <path d="M${x - 18} ${y - 34} h36 l-6 34 h-24z" fill="#c07a4f"/><rect x="${x - 21}" y="${y - 40}" width="42" height="8" rx="3" fill="#a8653e"/>
    <path d="M${x} ${y - 40} q-3 -30 2 -52" stroke="#6b4f33" stroke-width="4" fill="none"/>
    <g fill="#7c8d5a">${[[-18, -96], [12, -100], [-4, -118], [20, -80], [-22, -76], [4, -88]].map(([a, b]) => `<ellipse cx="${x + a}" cy="${y + b}" rx="17" ry="11"/>`).join("")}</g>
    <g fill="#95a76c">${[[-8, -104], [14, -90], [-16, -86]].map(([a, b]) => `<ellipse cx="${x + a}" cy="${y + b}" rx="9" ry="6"/>`).join("")}</g>`);
}

function laurel(cx, cy, s, color) {
  let h = `<g transform="translate(${cx},${cy}) scale(${s})" fill="${color}">`;
  for (const side of [-1, 1]) for (let i = 0; i < 6; i++) {
    const a = (200 + i * 22) * Math.PI / 180, r = 20;
    const x = side * Math.cos(a) * r, y = Math.sin(a) * r * 0.9;
    h += `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="6" ry="2.6" transform="rotate(${(side * (i * 22 - 60)).toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`;
  }
  return h + `</g>`;
}

/* desks, one per diplomat */
const desks = [];
function syncDesks(n) {
  while (desks.length < Math.min(n, DESKS.length)) {
    const [x, y] = DESKS[desks.length];
    const node = prop(y + 10, `
      <ellipse cx="${x}" cy="${y + 26}" rx="44" ry="8" fill="rgba(0,0,0,.14)"/>
      <rect x="${x - 6}" y="${y + 6}" width="12" height="18" fill="#6b4627"/>
      <path d="M${x - 40} ${y} h80 l6 9 h-92z" fill="url(#wood)"/>
      <rect class="plate" x="${x - 26}" y="${y + 1.5}" width="36" height="6.5" rx="2" fill="#f6edd8" opacity="0"/>
      <text class="plate-t" x="${x - 8}" y="${y + 7}" text-anchor="middle" font-size="6.5" font-weight="700" fill="#2b2f3a"></text>
      <rect x="${x + 12}" y="${y - 24}" width="28" height="20" rx="3" fill="#2b2f3a"/>
      <rect class="glow" x="${x + 10}" y="${y - 26}" width="32" height="24" rx="4" fill="none" stroke="#666" stroke-width="2" opacity=".0"/>
      <rect x="${x + 23}" y="${y - 4}" width="6" height="5" fill="#2b2f3a"/>`);
    desks.push({ x, y, node, glow: node.querySelector(".glow"), plate: node.querySelector(".plate"), plateT: node.querySelector(".plate-t") });
  }
}

/* -------------------------------------------------------------- penguins */

function penguinSVG(color) {
  const dark = shade(color, -0.35), light = shade(color, 0.35);
  return `
  <ellipse cx="0" cy="2" rx="22" ry="6" fill="rgba(0,0,0,.18)"/>
  <g class="flip"><g class="bod">
    <ellipse cx="-9" cy="0" rx="8" ry="4" fill="#f2a33a"/><ellipse cx="9" cy="0" rx="8" ry="4" fill="#f2a33a"/>
    <g class="fl" transform="translate(-18,-40)"><ellipse cx="-2" cy="12" rx="5.5" ry="14" fill="#1f2430" transform="rotate(16)"/></g>
    <g class="fr" transform="translate(18,-40)"><ellipse cx="2" cy="12" rx="5.5" ry="14" fill="#1f2430" transform="rotate(-16)"/></g>
    <ellipse cx="0" cy="-30" rx="21" ry="29" fill="#1f2430"/>
    <ellipse cx="0" cy="-26" rx="15" ry="22" fill="#fbfaf7"/>
    <circle cx="0" cy="-60" r="16" fill="#1f2430"/>
    <path d="M-11 -60 q0 -9 11 -6 q11 -3 11 6 q0 10 -11 11 q-11 -1 -11 -11z" fill="#fbfaf7"/>
    <g class="eyes"><circle cx="-5" cy="-61" r="2.6" fill="#15171e"/><circle cx="5" cy="-61" r="2.6" fill="#15171e"/>
      <circle cx="-4.2" cy="-62" r=".9" fill="#fff"/><circle cx="5.8" cy="-62" r=".9" fill="#fff"/></g>
    <path class="shut" d="M-8 -61 h5 M3 -61 h5" stroke="#15171e" stroke-width="1.6" stroke-linecap="round" opacity="0"/>
    <circle cx="-9" cy="-55" r="2.2" fill="#f4a4a4" opacity=".55"/><circle cx="9" cy="-55" r="2.2" fill="#f4a4a4" opacity=".55"/>
    <path d="M-4 -56 L4 -56 L0 -50z" fill="#f2a33a"/>
    <path d="M-15 -47 q15 7 30 0 l0 6 q-15 7 -30 0z" fill="${color}"/>
    <path d="M5 -43 l7 15 l-6 2 l-5 -15z" fill="${dark}"/>
    <path d="M-15.5 -67 q15.5 -24 31 0z" fill="${color}"/>
    <rect x="-16.5" y="-69" width="33" height="5.5" rx="2.7" fill="${dark}"/>
    <circle cx="0" cy="-82" r="4.2" fill="${light}"/>
    <g class="laurel" opacity="0">${laurel(0, -66, 0.95, "#d4a73a")}</g>
    <g class="scroll" opacity="0" transform="translate(21,-26) rotate(-20)"><rect x="-4" y="-10" width="8" height="20" rx="2" fill="#f6edd8" stroke="#c9b48c"/><rect x="-5" y="-11" width="10" height="3" rx="1.5" fill="#c99a2e"/></g>
  </g></g>`;
}

function tagSVG(name, color) {
  const w = Math.max(34, name.length * 7 + 14);
  return `<g transform="translate(0,18)"><rect x="${-w / 2}" y="-8" width="${w}" height="16" rx="8" fill="rgba(251,247,238,.92)" stroke="${color}" stroke-width="1.5"/>` +
    `<text y="4" text-anchor="middle" font-size="11" font-weight="650" fill="#2b2f3a">${esc(name)}</text></g>`;
}

function bubbleSVG(text, fill, stroke, y) {
  const w = Math.max(28, text.length * 7.2 + 18);
  return `<g transform="translate(0,${y})"><rect x="${-w / 2}" y="-13" width="${w}" height="24" rx="12" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>` +
    `<path d="M-5 10.5 L0 18 L5 10.5z" fill="${fill}"/><path d="M-5 11 L0 18 L5 11" fill="none" stroke="${stroke}" stroke-width="1.5"/>` +
    `<text y="3.5" text-anchor="middle" font-size="12.5" font-weight="650" fill="#2b2f3a">${esc(text)}</text></g>`;
}

const penguins = new Map();
const puffers = new Map();

function makePenguin(a) {
  const node = mk("g", { class: "penguin", style: "cursor:pointer", visibility: "hidden" }, world);
  const body = group(penguinSVG(a.color), node);
  const tag = group(tagSVG(a.name, a.color), node);
  const bubble = mk("g", {}, node);
  const p = { name: a.name, data: a, node, body, tag, bubble, x: rand(FLOOR.x0, FLOOR.x1), y: 650, tx: 0, ty: 0,
    face: 1, lift: 0, wanderAt: 0, say: null, bubbleKey: "", fresh: true,
    flip: body.querySelector(".flip"), bod: body.querySelector(".bod"), fl: body.querySelector(".fl"),
    fr: body.querySelector(".fr"), laurel: body.querySelector(".laurel"), scroll: body.querySelector(".scroll"),
    eyes: body.querySelector(".eyes"), shut: body.querySelector(".shut") };
  p.ty = p.y; p.tx = p.x;
  node.addEventListener("mousemove", e => showTip(e, p.data));
  node.addEventListener("mouseleave", () => { tip.style.display = "none"; });
  node.addEventListener("click", () => fetch(`/focus?agent=${encodeURIComponent(p.name)}`, { method: "POST" }).catch(() => {}));
  return p;
}

/* --------------------------------------------------------------- puffers */

function pufferSVG(color) {
  const dark = shade(color, -0.3), light = shade(color, 0.45);
  let spikes = "";
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * Math.PI * 2, c = Math.cos(a), s = Math.sin(a);
    spikes += `<path d="M${(c * 9).toFixed(1)} ${(s * 9).toFixed(1)} L${(c * 14.5).toFixed(1)} ${(s * 14.5).toFixed(1)} L${(Math.cos(a + .22) * 9).toFixed(1)} ${(Math.sin(a + .22) * 9).toFixed(1)}z" fill="${dark}"/>`;
  }
  return `
  <circle r="21" fill="rgba(190,228,250,.28)" stroke="rgba(255,255,255,.75)" stroke-width="1.5"/>
  <path d="M-12 -12 q6 -6 14 -6" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none" opacity=".8"/>
  <g class="fish">
    <g class="spikes">${spikes}</g>
    <path d="M-10 0 l-7 -6 l1 12z" fill="${dark}"/>
    <circle r="10" fill="${color}"/>
    <ellipse cy="4" rx="7" ry="4.5" fill="${light}"/>
    <ellipse cx="-1" cy="-2" rx="3" ry="2" fill="${dark}" opacity=".6"/>
    <g class="eyes"><circle cx="4.5" cy="-2.5" r="2.8" fill="#fff"/><circle cx="5.2" cy="-2.4" r="1.5" fill="#15171e"/></g>
    <path class="shut" d="M2.5 -2.5 h4.5" stroke="#15171e" stroke-width="1.4" stroke-linecap="round" opacity="0"/>
    <circle cx="9" cy="2.5" r="1.4" fill="${dark}"/>
  </g>`;
}

function makePuffer(a) {
  const node = mk("g", { class: "puffer", style: "cursor:pointer", visibility: "hidden" }, world);
  const inner = group(pufferSVG(a.color), node);
  const label = mk("text", { y: 34, "text-anchor": "middle", "font-size": 10.5, "font-weight": 650, fill: "#2b2f3a",
    stroke: "rgba(251,247,238,.85)", "stroke-width": 3, "paint-order": "stroke" }, node);
  const short = a.parent && a.name.startsWith(a.parent + "-") ? a.name.slice(a.parent.length + 1) : a.name;
  label.textContent = short.length > 14 ? short.slice(0, 13) + "…" : short;
  const bubble = mk("g", {}, node);
  const f = { name: a.name, data: a, node, inner, label, bubble, x: rand(200, 800), y: rand(270, 310), tx: 0, ty: 0,
    phase: rand(0, 6.28), puff: 1, wanderAt: 0, say: null, bubbleKey: "", color: a.color, fresh: true,
    fish: inner.querySelector(".fish"), spikes: inner.querySelector(".spikes"),
    eyes: inner.querySelector(".eyes"), shut: inner.querySelector(".shut") };
  f.tx = f.x; f.ty = f.y;
  node.addEventListener("mousemove", e => showTip(e, f.data));
  node.addEventListener("mouseleave", () => { tip.style.display = "none"; });
  node.addEventListener("click", () => fetch(`/focus?agent=${encodeURIComponent(f.name)}`, { method: "POST" }).catch(() => {}));
  return f;
}

/* ---------------------------------------------------------------- state */

let state = null, prevBids = null, prevLeader = undefined, prevFinished = false;
const STATE_WORDS = {
  working: "working", idle: "between requests", done: "between requests", completed: "between requests",
  needs_input: "waiting on you", waiting: "waiting on you", blocked: "waiting on you", limited: "at a usage limit",
  ended: "session ended", none: "no session seen", node: "a node"
};
const waitingState = s => s === "needs_input" || s === "waiting" || s === "blocked";

function showTip(e, a) {
  const words = a.diplomat ? STATE_WORDS[a.state] || a.state
    : (a.state === "limited" ? "at a usage limit" : a.state === "working" ? "has a bid out" : "a node");
  const parent = a.diplomat ? "" : a.parent ? `<div>from <b>${esc(a.parent)}</b>, its diplomat</div>` : `<div>from no diplomat: yours, the browsing node</div>`;
  const pend = (a.pending || []).map(b => `<li>#${b.id} ${esc(b.title)}</li>`).join("");
  tip.innerHTML = `<div class="name"><span class="sw" style="background:${a.color}"></span>${esc(a.name)}${a.leader ? " · leader" : ""}</div>` +
    `<div>${a.diplomat ? "diplomat (" + esc(a.kind) + ")" : "puffer"}: ${esc(words)}</div>${parent}` +
    `<div>${a.merges || 0} merged${a.led ? `, led ${a.led} terms` : ""}</div>` +
    (pend ? `<div>bids out:</div><ul>${pend}</ul>` : "") +
    (a.diplomat ? `<div style="color:#8a8478;margin-top:4px">click: its tab</div>` : "");
  tip.style.display = "block";
  const r = document.getElementById("stage").getBoundingClientRect();
  let x = e.clientX - r.left + 14, y = e.clientY - r.top + 14;
  if (x + tip.offsetWidth > r.width - 6) x = e.clientX - r.left - tip.offsetWidth - 14;
  if (y + tip.offsetHeight > r.height - 6) y = e.clientY - r.top - tip.offsetHeight - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}

function say(name, text, kind) {
  const e = penguins.get(name) || puffers.get(name);
  if (e) e.say = { text, kind, until: performance.now() + 4500 };
}

function apply(s) {
  const first = state === null;
  state = s;
  document.getElementById("gone").style.display = "none";
  document.getElementById("title").innerHTML = `🏛 <b>${esc(s.title)}</b> · ${esc(s.network)}`;
  document.getElementById("chain").textContent = `height ${s.height} · term ${s.term}`;
  const dips = s.agents.filter(a => a.diplomat), nodes = s.agents.filter(a => !a.diplomat);
  document.getElementById("count").textContent =
    `${dips.length} diplomat${dips.length === 1 ? "" : "s"} · ${nodes.length} puffer${nodes.length === 1 ? "" : "s"}`;

  // the boards
  document.getElementById("planboard").innerHTML = `<h3>THE PLAN</h3>` + (s.tasks.length
    ? s.tasks.map(t => `<div class="row"><span class="id">#${t.id}</span><span class="t">${t.repo ? `<b>${esc(t.repo)}</b>: ` : ""}${esc(t.text)}</span></div>`).join("")
    : `<div class="empty">${s.finished ? "Done: no more tasks." : "No task open."}</div>`);
  const DOT = { merged: "#2f9e5b", pending: "#e3b23c", rejected: "#d1495b", cleared: "#b9b2a5", withdrawn: "#b9b2a5" };
  const recent = s.bids.slice(-6).reverse();
  document.getElementById("bidboard").innerHTML = `<h3>BIDS</h3>` + (recent.length
    ? recent.map(b => `<div class="row"><span class="dot" style="background:${DOT[b.state] || "#b9b2a5"}"></span><span class="t">${esc(b.title)} <span class="id">· ${esc(b.by)}</span></span></div>`).join("")
    : `<div class="empty">No bids yet.</div>`);
  const last = s.bids[s.bids.length - 1];
  document.getElementById("ticker").textContent = last
    ? `bid #${last.id} by ${last.by}, ${last.state}: ${last.title}` : (s.finished ? "The market finished." : "No bids yet.");

  // penguins: the diplomats
  syncDesks(dips.length);
  const seen = new Set();
  dips.forEach((a, i) => {
    let p = penguins.get(a.name);
    if (!p || p.data.color !== a.color) { if (p) p.node.remove(); p = makePenguin(a); penguins.set(a.name, p); }
    p.data = a; p.desk = desks[i] || null; seen.add(a.name);
    if (p.desk) {
      p.desk.plateT.textContent = a.name.length > 9 ? a.name.slice(0, 8) + "…" : a.name;
      p.desk.plate.setAttribute("opacity", 1); p.desk.plate.setAttribute("stroke", a.color);
    }
  });
  for (const [n, p] of penguins) if (!seen.has(n)) { p.node.remove(); penguins.delete(n); }

  // puffers: every other node, after the diplomat it came from
  const pseen = new Set();
  nodes.forEach(a => {
    let f = puffers.get(a.name);
    if (!f || f.color !== a.color) {
      const old = f; f = makePuffer(a); puffers.set(a.name, f);
      const parent = a.parent && penguins.get(a.parent);
      if (old) { f.x = old.x; f.y = old.y; old.node.remove(); }
      else if (parent) { f.x = parent.x; f.y = parent.y - 60; }
    }
    f.data = a; pseen.add(a.name);
  });
  for (const [n, f] of puffers) if (!pseen.has(n)) { burst(f.x, f.y, f.color, 10); f.node.remove(); puffers.delete(n); }
  // siblings: each puffer's place among its diplomat's
  const byParent = {};
  for (const f of puffers.values()) { const k = f.data.parent || ""; (byParent[k] = byParent[k] || []).push(f); }
  for (const k in byParent) byParent[k].sort((a, b) => a.name < b.name ? -1 : 1).forEach((f, i) => { f.slot = i; });

  // what happened since the last state: merges, new bids, a new leader
  if (!first) {
    for (const b of s.bids) {
      const was = prevBids.get(b.id);
      if (b.state === "merged" && was && was !== "merged") {
        say(b.by, `merged #${b.id}!`, "merged");
        const e = penguins.get(b.by) || puffers.get(b.by);
        if (e) burst(e.x, e.y - 50, null, 36);
      } else if (!was && b.state === "pending") say(b.by, `bid #${b.id}`, "bid");
    }
    if (s.leader && s.leader !== prevLeader) {
      say(s.leader, "my term", "leader");
      const e = penguins.get(s.leader);
      if (e) burst(e.x, e.y - 80, "#d4a73a", 20);
    }
    if (s.finished && !prevFinished) burst(500, 200, null, 120);
  }
  prevBids = new Map(s.bids.map(b => [b.id, b.state]));
  prevLeader = s.leader;
  prevFinished = s.finished;
}

/* ----------------------------------------------------------------- motion */

function targetFor(p, t) {
  const a = p.data;
  if (state && state.finished) return wander(p, t);
  if (waitingState(a.state)) {
    const i = [...penguins.values()].filter(q => waitingState(q.data.state)).indexOf(p);
    const off = [[-58, 0], [58, 0], [-100, -14], [100, -14], [-140, -26], [140, -26]][i % 6];
    return [BELL.x + off[0], BELL.y + off[1]];
  }
  if (a.state === "limited") {
    const i = [...penguins.values()].filter(q => q.data.state === "limited").indexOf(p);
    return [BENCH.x - 44 + (i % 4) * 30, BENCH.y - 2];
  }
  if (a.leader) return [ROSTRUM.x, ROSTRUM.y];
  if (a.state === "working" && p.desk) return [p.desk.x - 14, p.desk.y - 6];
  return wander(p, t);
}
function wander(p, t) {
  if (t > p.wanderAt || p.wanderTarget == null) {
    p.wanderTarget = [rand(FLOOR.x0, FLOOR.x1), rand(FLOOR.y0, FLOOR.y1)];
    p.wanderAt = t + rand(3.5, 9);
  }
  return p.wanderTarget;
}

function bubbleFor(e, now, isPenguin) {
  if (e.say && now < e.say.until) {
    const k = e.say.kind;
    const fill = k === "merged" ? "#d9f2e1" : k === "leader" ? "#fbefc8" : "#fbf7ee";
    const stroke = k === "merged" ? "#2f9e5b" : k === "leader" ? "#c99a2e" : "#b9ad97";
    return [e.say.text + k, bubbleSVG(e.say.text, fill, stroke, isPenguin ? -106 : -36)];
  }
  const s = e.data.state;
  if (waitingState(s) && isPenguin) return ["wait", bubbleSVG("!", "#ffe28a", "#d9a400", -106)];
  if (s === "limited") return ["zzz", bubbleSVG("z z z", "#e4e9f5", "#9aa6c4", isPenguin ? -106 : -36)];
  if (s === "working" && isPenguin) {
    const dots = "•".repeat(1 + Math.floor(now / 400) % 3);
    return ["work" + dots, bubbleSVG(dots, "#fbf7ee", "#b9ad97", -106)];
  }
  return ["", ""];
}

let lastT = performance.now(), order = [];
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000), t = now / 1000;
  lastT = now;

  for (const p of penguins.values()) {
    const [tx, ty] = targetFor(p, t);
    if (p.fresh) { p.x = tx; p.y = ty; p.fresh = false; }
    const dx = tx - p.x, dy = ty - p.y, dist = Math.hypot(dx, dy);
    const s = depth(p.y), speed = 78 * s;
    const moving = dist > 2;
    if (moving) { const k = Math.min(1, speed * dt / dist); p.x += dx * k; p.y += dy * k; if (Math.abs(dx) > 1.5) p.face = dx > 0 ? 1 : -1; }
    const atRostrum = Math.hypot(p.x - ROSTRUM.x, p.y - ROSTRUM.y) < 14;
    p.lift += ((atRostrum ? 22 : 0) - p.lift) * Math.min(1, dt * 6);
    p.node.setAttribute("transform", `translate(${p.x.toFixed(1)},${(p.y - p.lift).toFixed(1)}) scale(${s.toFixed(3)})`);
    p.flip.setAttribute("transform", `scale(${p.face},1)`);
    p.node.setAttribute("visibility", "visible");
    const waddle = moving && !reduced ? Math.sin(t * 12) * 7 : 0;
    const hop = moving && !reduced ? -Math.abs(Math.sin(t * 12)) * 2.5 : 0;
    p.bod.setAttribute("transform", `translate(0,${hop.toFixed(1)}) rotate(${waddle.toFixed(1)})`);
    // flippers: typing at a desk, waving at the bell, else at rest
    let l = 0, r = 0;
    const st = p.data.state;
    if (!moving && st === "working" && !reduced) { l = Math.sin(t * 22) * 14 - 20; r = Math.sin(t * 22 + 1.7) * 14 + 20; }
    else if (!moving && waitingState(st) && !reduced) { r = -120 + Math.sin(t * 7) * 25; }
    else if (moving) { l = Math.sin(t * 12) * 12; r = -Math.sin(t * 12) * 12; }
    p.fl.setAttribute("transform", `translate(-18,-40) rotate(${l.toFixed(1)})`);
    p.fr.setAttribute("transform", `translate(18,-40) rotate(${r.toFixed(1)})`);
    p.laurel.setAttribute("opacity", p.data.leader ? 1 : 0);
    p.scroll.setAttribute("opacity", (p.data.pending || []).length ? 1 : 0);
    const asleep = st === "limited" || st === "ended";
    p.eyes.setAttribute("opacity", asleep ? 0 : 1);
    p.shut.setAttribute("opacity", asleep ? 1 : 0);
    p.node.setAttribute("opacity", st === "ended" || st === "none" ? 0.6 : 1);
    if (p.desk) p.desk.glow.setAttribute("opacity", st === "working" && !p.data.leader ? 0.9 : 0),
      p.desk.glow.setAttribute("stroke", p.data.color);
    const [key, html] = bubbleFor(p, now, true);
    if (key !== p.bubbleKey) { p.bubble.innerHTML = html; p.bubbleKey = key; }
    p.sortY = p.y;
  }

  for (const f of puffers.values()) {
    const parent = f.data.parent && penguins.get(f.data.parent);
    let tx, ty, s;
    if (parent) {
      const i = f.slot || 0, side = i % 2 ? 1 : -1, row = Math.floor(i / 2);
      s = depth(parent.y);
      tx = parent.x + side * (34 + 18 * row) * s;
      ty = parent.y - parent.lift - (92 + 16 * row) * s;
      if (f.fresh) { f.x = tx; f.y = ty; }
      f.x += (tx - f.x) * Math.min(1, dt * 2.2);
      f.y += (ty - f.y) * Math.min(1, dt * 2.2);
      f.sortY = parent.y + 0.5;
    } else {
      // from no diplomat: drifting in the air of the hall
      // in the light of the oculus, above the middle of the hall
      if (t > f.wanderAt) { f.tx = rand(340, 660); f.ty = rand(380, 440); f.wanderAt = t + rand(5, 11); }
      if (f.fresh) { f.x = f.tx; f.y = f.ty; }
      f.x += (f.tx - f.x) * Math.min(1, dt * 0.35);
      f.y += (f.ty - f.y) * Math.min(1, dt * 0.35);
      s = depth(f.y + 50); f.sortY = f.y + 50;
    }
    f.fresh = false;
    const st = f.data.state, puffed = st === "working";
    f.puff += ((puffed ? 1.28 : 0.92) - f.puff) * Math.min(1, dt * 3);
    const bob = reduced ? 0 : Math.sin(t * (puffed ? 3.2 : 1.8) + f.phase) * 4;
    const tilt = reduced ? 0 : Math.sin(t * 1.3 + f.phase) * 8;
    f.node.setAttribute("transform", `translate(${f.x.toFixed(1)},${(f.y + bob).toFixed(1)}) scale(${s.toFixed(3)})`);
    f.fish.setAttribute("transform", `rotate(${tilt.toFixed(1)}) scale(${f.puff.toFixed(3)})`);
    f.node.setAttribute("visibility", "visible");
    f.spikes.setAttribute("opacity", puffed ? 1 : 0.25);
    f.eyes.setAttribute("opacity", st === "limited" ? 0 : 1);
    f.shut.setAttribute("opacity", st === "limited" ? 1 : 0);
    const [key, html] = bubbleFor(f, now, false);
    if (key !== f.bubbleKey) { f.bubble.innerHTML = html; f.bubbleKey = key; }
  }

  // depth: whatever is lower on the floor is in front
  const items = props.map(p => [p.y, p.node])
    .concat([...penguins.values()].map(p => [p.sortY, p.node]))
    .concat([...puffers.values()].map(f => [f.sortY, f.node]))
    .sort((a, b) => a[0] - b[0]);
  if (items.length !== order.length || items.some((it, i) => it[1] !== order[i])) {
    items.forEach(it => world.appendChild(it[1]));
    order = items.map(it => it[1]);
  }

  for (const m of motes) {
    m.y += m.v * dt; if (m.y > 425) { m.y = 20; m.x = rand(460, 540); }
    const spread = (m.y / 425) * 110;
    m.el.setAttribute("cx", (500 + (m.x - 500) / 60 * spread + Math.sin(t + m.p) * 6).toFixed(1));
    m.el.setAttribute("cy", m.y.toFixed(1));
    m.el.setAttribute("opacity", (0.6 * Math.sin(Math.PI * m.y / 425)).toFixed(2));
  }
  stepFx(dt);
  requestAnimationFrame(frame);
}

/* confetti */
const bits = [];
const CONFETTI = ["#d97757", "#10a37f", "#3b82f6", "#a855f7", "#f2a33a", "#e11d48", "#d4a73a"];
function burst(x, y, color, n) {
  if (reduced) return;
  for (let i = 0; i < n; i++) {
    const el = mk("rect", { width: 5, height: 3, rx: 1, fill: color || CONFETTI[i % CONFETTI.length] }, fxLayer);
    bits.push({ el, x, y, vx: rand(-110, 110), vy: rand(-220, -60), r: rand(0, 360), vr: rand(-400, 400), life: rand(1.2, 2.2) });
  }
}
function stepFx(dt) {
  for (let i = bits.length - 1; i >= 0; i--) {
    const b = bits[i];
    b.life -= dt; b.vy += 320 * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
    if (b.life <= 0) { b.el.remove(); bits.splice(i, 1); continue; }
    b.el.setAttribute("transform", `translate(${b.x.toFixed(1)},${b.y.toFixed(1)}) rotate(${b.r.toFixed(0)})`);
    b.el.setAttribute("opacity", Math.min(1, b.life).toFixed(2));
  }
}

/* ---------------------------------------------------------------- polling */

let misses = 0;
async function poll() {
  try {
    const r = await fetch("/state.json", { cache: "no-store" });
    const s = await r.json();
    misses = 0;
    if (s.error) {
      const g = document.getElementById("gone");
      g.textContent = `The club can't read the market: ${s.error}`;
      g.style.display = "flex";
    } else apply(s);
  } catch (e) {
    if (++misses >= 3) {
      const g = document.getElementById("gone");
      g.textContent = "The club's server stopped. pantheon-club attach NET starts it again.";
      g.style.display = "flex";
    }
  }
  setTimeout(poll, 2000);
}

drawRoom();
drawProps();
poll();
requestAnimationFrame(frame);
</script>
